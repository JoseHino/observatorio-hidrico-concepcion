<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatorio Hídrico · La Concepción</title>
<meta name="description" content="Reserva, cota y precipitaciones del embalse de La Concepción (Istán, Málaga). Datos de REDIAM y la Red Hidrosur con actualización diaria automática.">

<!-- Tipografía del kit. Si no carga, la pila de respaldo mantiene el diseño. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232a78d6'/%3E%3Cpath d='M5 6v12h13' stroke='white' stroke-width='1.9' fill='none' stroke-linecap='round'/%3E%3Cpath d='m8 14 3-3 3 3 4-6' stroke='white' stroke-width='1.9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;650&display=swap" rel="stylesheet">

<!-- Kit: no se toca por observatorio -->
<link rel="stylesheet" href="assets/obs.css">

<!-- Ajustes de marca de ESTE observatorio. Es el único sitio donde tocar color. -->
<style>
  :root { --brand: #1f6fb2; --brand-ink: #175690; --brand-soft: #e8f1fa; }
  /* Una sola vista: la barra de pestanas no aporta nada. */
  .obs-nav { display: none; }
  /* La tarjeta de lluvia lleva selector de estacion: en movil la cabecera
     pasa a dos lineas en vez de salirse de la pantalla. */
  @media (max-width: 560px) { .obs-card-head { flex-wrap: wrap; } .obs-card-head .t { flex-basis: 100%; } }

  /* Calculadora de riesgo de llenado (bloque propio de este observatorio). */
  .hidrico-sim { margin-top: 16px; }
  .hidrico-sim-in { padding: 14px 17px 0; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .hidrico-sim-in label { display: inline-flex; align-items: center; gap: 10px; }
  .hidrico-sim-in label > span:first-child { color: var(--ink-mut); font-size: 12px; font-weight: 600; }
  .hidrico-sim-campo { font-weight: 600; color: var(--ink); }
  .hidrico-sim-campo input { width: 90px; font: inherit; font-size: 16px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--surface); color: var(--ink); }
  .hidrico-sim-in input[type="range"] { flex: 1 1 220px; accent-color: var(--brand); cursor: pointer; }
  .hidrico-sim-out { padding: 16px 17px 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .hidrico-sim-out .v { font-size: 22px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
  .hidrico-sim-out .l { font-size: 12px; color: var(--ink-mut); margin-top: 2px; }
  .hidrico-sim-nivel { grid-column: 1 / -1; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border-left: 4px solid; background: var(--brand-soft); color: var(--ink); }
  .hidrico-sim-nivel.ok { border-color: var(--ok); }
  .hidrico-sim-nivel.warn { border-color: var(--warn); }
  .hidrico-sim-nivel.crit { border-color: var(--crit); }
  .hidrico-sim-ecu { padding: 12px 17px 16px; font-size: 12px; line-height: 1.6; color: var(--ink-2); }
  .hidrico-sim-ecu code { font-size: 12px; background: var(--brand-soft); padding: 1px 5px; border-radius: 4px; color: var(--ink); }
  @media (max-width: 560px) { .hidrico-sim-out { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="obs-app"></div>

<!-- Librería de gráficas -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<!-- Kit -->
<script src="assets/obs-charts.js"></script>
<script src="assets/obs-ui.js"></script>
<!-- Datos (los escribe pipeline/build_data.py) -->
<script src="data/data.js"></script>
<!-- Declaración de ESTE observatorio -->
<script src="app.js"></script>

</body>
</html>
