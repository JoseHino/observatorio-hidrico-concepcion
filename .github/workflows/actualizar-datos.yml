name: Actualizar datos

# Cada 15 minutos. Red Hidrosur publica la cota y la lluvia hora a hora, pero
# GitHub se salta muchas pasadas programadas: con el cron cada 3 h solo llegaban
# 3-4 al dia y la web se quedaba 6-10 h atrasada. Lanzando cada 15 min, aunque
# GitHub descarte la mitad, entra el dato de cada hora poco despues de
# publicarse. Cada pasada dura ~40 s y solo hace commit si hay datos nuevos.
#
# Aun asi GitHub puede pasar horas sin lanzar ninguna (el 11-11-2026 no lanzo
# ninguna en 80 min tras el cambio). Por eso cada pasada, al acabar, espera
# ~14 min y lanza la siguiente ella misma (workflow_dispatch con GITHUB_TOKEN).
# El cron queda de respaldo: si la cadena se rompe, la vuelve a arrancar.
# El grupo de concurrencia deja solo 1 en marcha + 1 en espera, asi que las
# cadenas no se multiplican. Se puede lanzar a mano desde Actions.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Recolectar
        # Si el colector aborta (datos peores que los publicados) el paso falla
        # y data.js se queda como estaba. Es el comportamiento que se quiere.
        run: python pipeline/build_data.py

      - name: Publicar si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data pipeline/cache && [ -z "$(git status --porcelain data pipeline/cache)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git add data pipeline/cache
          git commit -m "Datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Encadenar la siguiente pasada
        # Tambien si el colector ha fallado: un fallo puntual de Hidrosur no
        # debe parar la cadena. No se ejecuta si la pasada se cancela.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 840
          gh workflow run actualizar-datos.yml -R "$GITHUB_REPOSITORY" --ref main
