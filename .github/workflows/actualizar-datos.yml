name: Actualizar datos

# Todos los días a las 08:15 UTC (10:15 en verano, 09:15 en invierno): REDIAM
# publica la reserva de las 8:00 hora peninsular poco después. Se puede lanzar a
# mano desde la pestaña Actions.
on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Recolectar
        # Si el colector aborta (datos peores que los publicados) el paso falla
        # y data.js se queda como estaba. Es el comportamiento que se quiere.
        run: python pipeline/build_data.py

      - name: Publicar si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data pipeline/cache && [ -z "$(git status --porcelain data pipeline/cache)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git add data pipeline/cache
          git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
          git push
