name: Actualizar datos

# Cada 3 horas. GitHub retrasa los cron programados varias horas (el de las
# 08:15 UTC llegaba a las 15-18 UTC), asi que con una sola pasada diaria el dia
# anterior no quedaba completo hasta la tarde. Con 8 pasadas, la de pasada la
# medianoche ya deja el dia anterior entero. Se puede lanzar a mano desde Actions.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Recolectar
        # Si el colector aborta (datos peores que los publicados) el paso falla
        # y data.js se queda como estaba. Es el comportamiento que se quiere.
        run: python pipeline/build_data.py

      - name: Publicar si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data pipeline/cache && [ -z "$(git status --porcelain data pipeline/cache)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git add data pipeline/cache
          git commit -m "Datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
